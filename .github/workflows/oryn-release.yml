# Oryn 发布：tag `oryn-v*` 触发，构建 linux-x64 / linux-arm64 / darwin-arm64 的单文件 omp 与 RPC 类型声明并发布 Release。
# 不出 Intel mac（darwin-x64）：macos-15-intel 构建近一小时且按 macOS 倍率计费，Runner 只支持 Apple 芯片的 mac。
# 规程见 ORYN.md。
name: oryn-release

on:
   push:
      tags: ["oryn-v*"]
   workflow_dispatch:
      inputs:
         tag:
            description: "要发布的已有 tag（oryn-v<版本>-<序号>）"
            required: true

permissions:
   contents: read

concurrency:
   group: oryn-release-${{ github.event.inputs.tag || github.ref_name }}
   cancel-in-progress: false

env:
   RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
   build:
      name: build ${{ matrix.asset }}
      runs-on: ${{ matrix.runner }}
      timeout-minutes: 120
      strategy:
         fail-fast: false
         matrix:
            include:
               - runner: ubuntu-24.04
                 target: bun-linux-x64-baseline
                 asset: omp-linux-x64
                 emit_dts: true
               - runner: ubuntu-24.04-arm
                 target: bun-linux-arm64
                 asset: omp-linux-arm64
                 emit_dts: false
               # macos-13 已下线、macos-14 已退役（actions/runner-images）；uname_m 供构建前断言架构，防止标签变动后产出错的架构。
               - runner: macos-15
                 target: bun-darwin-arm64
                 asset: omp-darwin-arm64
                 emit_dts: false
                 uname_m: arm64
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ env.RELEASE_TAG }}
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
         # 锁文件带有 nornzach 嵌套 GUI 布局（packages/gui）的条目，--frozen-lockfile 会失败；构建只需要依赖装齐。
         - name: bun install
           run: bun install
         # natives 从源码构建（Oryn Core 改了 crates/natives，见 ORYN.md）：系统依赖同上游 Dockerfile 的
         # natives-builder（bindgen 需要 clang，opusic-sys 用 CMake 构建 libopus），工具链取 rust-toolchain.toml。
         - name: Native build dependencies (Linux)
           if: runner.os == 'Linux'
           run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends pkg-config libssl-dev clang libclang-dev cmake make ninja-build
         # macOS：clang / libclang 用 Xcode 自带（clang-sys 经 xcode-select 找到），只补 cmake、ninja（镜像已带的不重装，避免 brew link 冲突）。
         - name: Native build dependencies (macOS)
           if: runner.os == 'macOS'
           run: |
              for tool in cmake ninja; do command -v "$tool" >/dev/null || brew install "$tool"; done
              cmake --version
              ninja --version
         - name: Rust toolchain
           run: |
              if ! command -v rustup >/dev/null; then
                 curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
                 echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                 export PATH="$HOME/.cargo/bin:$PATH"
              fi
              rustup show
              cargo --version
         - name: Assert architecture (macOS)
           if: runner.os == 'macOS'
           run: test "$(uname -m)" = "${{ matrix.uname_m }}"
         - name: Build omp
           run: bun scripts/oryn/build-agent.ts --target ${{ matrix.target }} --out dist/${{ matrix.asset }}
         # 同上游 scripts/ci-release-build-binaries.ts：bun 编出的 Mach-O 签名不保证可用（arm64 不签无法运行），重新 ad-hoc 签名。
         - name: Ad-hoc codesign (macOS)
           if: runner.os == 'macOS'
           run: |
              codesign --force --sign - --entitlements scripts/macos-entitlements.plist dist/${{ matrix.asset }}
              codesign --verify --verbose dist/${{ matrix.asset }}
         - name: omp --version
           run: ./dist/${{ matrix.asset }} --version
         - name: omp --smoke-test
           run: ./dist/${{ matrix.asset }} --smoke-test
         - name: smoke-rpc
           run: node scripts/oryn/smoke-rpc.mjs ./dist/${{ matrix.asset }}
         - name: Emit omp-rpc-types.d.ts
           if: ${{ matrix.emit_dts }}
           run: bun scripts/oryn/emit-rpc-dts.ts --out dist/omp-rpc-types.d.ts
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: ${{ matrix.asset }}
              path: |
                 dist/${{ matrix.asset }}
                 dist/omp-rpc-types.d.ts
              if-no-files-found: error
              retention-days: 7

   release:
      needs: build
      runs-on: ubuntu-24.04
      timeout-minutes: 15
      permissions:
         contents: write
      steps:
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              path: dist
              merge-multiple: true
         - name: SHA256SUMS
           working-directory: dist
           run: |
              ls -la
              sha256sum omp-linux-x64 omp-linux-arm64 omp-darwin-arm64 omp-rpc-types.d.ts > SHA256SUMS
              cat SHA256SUMS
         - name: Publish release
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
           run: |
              commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
              notes="Oryn agent build from \`$commit\`. See ORYN.md."
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "$notes" \
                 dist/omp-linux-x64 dist/omp-linux-arm64 dist/omp-darwin-arm64 \
                 dist/omp-rpc-types.d.ts dist/SHA256SUMS
